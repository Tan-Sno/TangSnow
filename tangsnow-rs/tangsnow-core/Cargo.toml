[package]
name = "tangsnow-core"
version = "0.1.0"
edition = "2021"
description = "棠雪 TangSnow 的 Rust 核心逻辑库：从 Kotlin 纯逻辑模块（UrlUtils/BookmarkHtml/SearchEngines/HistoryRepo）逐行移植，测试用例与 JVM 单测同源"
license = "Apache-2.0"

[lib]
name = "tangsnow_core"
crate-type = ["lib", "cdylib"]

[features]
default = []
# Android JNI 桥接：host 测试不需要；交叉编译时开启
jni = ["dep:jni", "dep:serde", "dep:serde_json"]

[dev-dependencies]
proptest = "1"
# 差分测试读**两侧共享的 JSON 夹具**（tests/fixtures/*.json）—— 期望值只存一份，
# 两侧都读它 ⇒ 改夹具必然两侧一起红（2026-10-20 审查报告 C-14）。
# serde_json 本来就是本 crate 的可选依赖（jni feature 用），这里复用同一版本。
serde_json = "1"

[dependencies]
regex = "1"
fancy-regex = "0.14"     # Kotlin 正则里的 lookbehind/lookahead 在 regex crate 不支持，这里兜住 HOST_PATTERN 与 HREF_ATTR
idna = "1"               # 对齐 java.net.IDN.toASCII 的域名转 ASCII
url = "2"                # 对齐 android.net.Uri.parse 的搜索结果页解析（displayForUrl）
jni = { version = "0.21", optional = true }
# JNI 字符串边界的 modified UTF-8（CESU-8）编解码。不是可选依赖：解码抽成了纯函数，
# host 测试（不开 `jni` feature）也要能钉住它。出向 `JNIEnv::new_string` 用的就是同一个 crate，
# 两侧同源才能保证「导出→导入可逆」。
cesu8 = "1"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
