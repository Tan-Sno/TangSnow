name: Bug report
description: Report a reproducible defect or unexpected behaviour
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Please fill in as much as you can — many issues
        cannot be pinned down from "a web page won't open" alone.

        Feel free to write in Chinese if that is easier for you.

        **Note**: if you are reporting a **security vulnerability**, please stop here and use the
        [private vulnerability report](https://github.com/Tan-Sno/TangSnow/security/advisories/new)
        instead — do not post it publicly. See the
        [security policy](https://github.com/Tan-Sno/TangSnow/blob/main/SECURITY.md).

  - type: input
    id: version
    attributes:
      label: TangSnow version
      description: Found under "Settings → About TangSnow" in the app
      placeholder: e.g. 2.1.4
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device model and Android version
      placeholder: e.g. Xiaomi 14 / Android 15
    validations:
      required: true

  - type: dropdown
    id: abi
    attributes:
      label: Which architecture did you install?
      description: The three APKs are identical apart from the CPU architecture. Pick "Not sure" if you do not know.
      options:
        - arm64-v8a (most modern phones)
        - armeabi-v7a (older 32-bit devices)
        - x86_64 (emulators / the few x86 devices)
        - Not sure
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Please write them out step by step so someone else can follow them to the problem
      placeholder: |
        1. Open ...
        2. Tap ...
        3. The app shows ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: URL that reproduces it
      description: If web rendering or a site's behaviour is involved, a URL is usually required to investigate
      placeholder: https://
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or screen recording
      description: You can drag images straight into this box
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: For example whether it always happens, only on certain networks, or also in private tabs
    validations:
      required: false
