name: Feature request
description: Suggest a feature to add or improve
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please start with the **scenario and the problem to be solved**, not just the feature itself.
        This matters more here than in most projects: TangSnow puts "data never leaves your device"
        first, and a feature described without its scenario usually cannot be assessed.

        Feel free to write in Chinese if that is easier for you.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the current friction or inconvenience rather than naming a feature
      placeholder: e.g. "When I ..., I need to ... but right now I can only ..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like TangSnow to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have tried
      description: Including how other browsers handle it, and why that is not enough for you
    validations:
      required: false

  - type: textarea
    id: privacy
    attributes:
      label: Privacy impact
      description: |
        If the feature needs a **new permission, a new network call or a third-party dependency**,
        say so here. Such proposals are reviewed more strictly, and one without this note is usually
        sent back.
    validations:
      required: false
