[versions]
agp = "9.4.1"
# AGP 9.x 内置 Kotlin 运行时依赖 KGP；显式升 KGP 即可让内置 Kotlin 编译器跟随升级。
# 原先该版本硬编码在根 buildscript 的 classpath 里，升级要改两处 —— 收口到本文件。
kotlin = "2.4.10"
# GeckoView 只跟 **Release 通道**：Mozilla 官方 product-details 显示当前 Release = 157.0
#（FIREFOX_NIGHTLY=159.0a1、DEVEL/Beta=158.0b1），155 已落后两个 release ⇒ 取 157 的最新构建。
geckoView = "157.0.20260924084938"
preferenceKtx = "1.2.1"
coroutinesAndroid = "1.11.0"
zxingCore = "3.5.4"
zxingEmbed = "4.3.0"
coreKtx = "1.19.1"
junit = "4.13.2"
appcompat = "1.8.0"
material = "1.14.0"
activityKtx = "1.13.0"
constraintlayout = "2.2.2"
okhttp = "5.5.0"
# 仅测试用：android.jar 里的 org.json 在 JVM 单元测试中是抛 Stub! 异常的桩，
# 用 Maven 的真实实现覆盖 test classpath，SessionStore 等纯 JSON 逻辑才能被单测。
json = "20260814"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activityKtx" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
preference-ktx = { group = "androidx.preference", name = "preference-ktx", version.ref = "preferenceKtx" }
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutinesAndroid" }
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxingCore" }
# 取景 Activity 与相机权限处理由这个库自带（见 AndroidManifest 的 CaptureActivity 声明）。
# 引用处以 isTransitive = false 引入，避免它再拉一份 zxing-core 与上面的版本打架。
zxing-embed = { group = "com.journeyapps", name = "zxing-android-embedded", version.ref = "zxingEmbed" }
geckoview = { group = "org.mozilla.geckoview", name = "geckoview", version.ref = "geckoView" }
json = { group = "org.json", name = "json", version.ref = "json" }
# KGP 走 buildscript classpath（不是 plugins{} 块），故用 libraries 别名而非 plugins 别名：
# plugins 段的别名会被解析成插件 marker，而这里要的是插件**构件**本身。
kotlin-gradle-plugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }

